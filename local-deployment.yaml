apiVersion: v1
kind: Namespace
metadata:
  name: adapter
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpgateway
  namespace: adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpgateway
  template:
    metadata:
      labels:
        app: mcpgateway
    spec:
      serviceAccountName: mcpgateway-sa
      containers:
        - name: mcpgateway-container
          # image: ghcr.io/microsoft/mcpgateway-service:latest
          # image: kamalberrybytes/mcp:1.0.0
          image: kamalberrybytes/microsoft-mcpgateway-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcpgateway-service
  namespace: adapter
spec:
  selector:
    app: mcpgateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcpgateway-sa
  namespace: adapter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-sa
  namespace: adapter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-manager
  namespace: adapter
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-manager-binding
  namespace: adapter
subjects:
  - kind: ServiceAccount
    name: mcpgateway-sa
    namespace: adapter
roleRef:
  kind: Role
  name: app-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: toolgateway
  namespace: adapter
spec:
  serviceName: toolgateway-service
  replicas: 1
  selector:
    matchLabels:
      app: toolgateway
  template:
    metadata:
      labels:
        app: toolgateway
        adapter/type: "mcp"
    spec:
      serviceAccountName: mcpgateway-sa
      containers:
        - name: toolgateway-container
          image: kamalberrybytes/microsoft-mcpgateway-tools
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: toolgateway-service
  namespace: adapter
spec:
  clusterIP: "None"
  selector:
    app: toolgateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: adapter
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data  # default redis data path
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: adapter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: adapter
data:
  ContainerRegistrySettings__Endpoint: "kamalberrybytes"

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-manager-cluster
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-manager-cluster-binding
subjects:
  - kind: ServiceAccount
    name: mcpgateway-sa
    namespace: adapter
roleRef:
  kind: ClusterRole
  name: app-manager-cluster
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcpgateway
  namespace: default

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hubspot-token-cronjob
spec:
  schedule: "*/23 * * * *"  # Every 25 minutes
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: mcpgateway 
          restartPolicy: OnFailure
          containers:
          - name: hubspot-script
            image: bitnami/kubectl:latest  # Has kubectl and bash
            envFrom:
            - secretRef:
                name: credentials
            command:
              - /bin/bash
              - -c
              - |
                echo "Listing mounted ConfigMap files:"
                ls -l /config
                echo "Copying script to /tmp..."
                cp /config/mcp-gateway-script.sh /tmp/script.sh
                chmod +x /tmp/script.sh
                echo "Installing dependencies..."
                apt-get update && apt-get install -y curl jq
                echo "Running HubSpot token script..."
                /tmp/script.sh
            volumeMounts:
            - name: script-volume
              mountPath: /config
          volumes:
          - name: script-volume
            configMap:
              name: hubspot-script-config


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubspot-script-config
data:
  mcp-gateway-script.sh: |
    #!/bin/bash
    set -e
    source /config/credentials.txt
    NAMESPACE=adapter
    SECRET_NAME=hubspot-access-token
    STATEFULSET_NAME=hubspot-mcp

    response=$(curl -s --request POST \
      --url https://api.hubapi.com/oauth/v1/token \
      --header "Content-Type: application/x-www-form-urlencoded" \
      --data "grant_type=refresh_token" \
      --data "client_id=$CLIENT_ID" \
      --data "client_secret=$CLIENT_SECRET" \
      --data "refresh_token=$REFRESH_TOKEN")

    ACCESS_TOKEN=$(echo $response | jq -r '.access_token')

    if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
        echo "Error: Failed to get access token"
        echo "Response: $response"
        exit 1
    fi

    if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
        kubectl create secret generic "$SECRET_NAME" \
          --from-literal=HUBSPOT_ACCESS_TOKEN="$ACCESS_TOKEN" \
          -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    else
        kubectl create secret generic "$SECRET_NAME" \
          --from-literal=HUBSPOT_ACCESS_TOKEN="$ACCESS_TOKEN" \
          -n "$NAMESPACE"
    fi

    if [ -n "$STATEFULSET_NAME" ]; then
        kubectl rollout restart statefulset "$STATEFULSET_NAME" -n "$NAMESPACE"
    fi

    echo "Script completed successfully."

---

